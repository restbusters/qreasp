buildscript {
    repositories {
        maven {
            url 'https://plugins.gradle.org/m2/'
        }
        //mavenLocal()
        mavenCentral()
        jcenter()
        maven {url "https://m2proxy.atlassian.com/repository/public"}
        maven {url 'https://maven.atlassian.com/content/repositories/atlassian-public'}
        maven{url 'https://packages.atlassian.com/maven-public/'}
        maven{url "https://maven.atlassian.com/repository/public"}
    }
    dependencies {
        classpath 'com.adarshr:gradle-test-logger-plugin:2.0.0'
        classpath "io.freefair.gradle:lombok-plugin:5.1.1"
    }
}

plugins {
    id 'java-library'
    id 'java'
    id 'idea'
    id 'signing'
    id 'maven-publish'
    id 'io.codearte.nexus-staging' version '0.22.0'
}


allprojects {
    task listProjects { task -> println "I'm $task.project.name" }
    group = 'com.restbusters'
    version = '0.0.2'

    repositories {
        mavenCentral()
        maven {
            url 'https://dl.bintray.com/android-infoedge/maven/'
        }
        jcenter()
    }
}


sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

rootProject.description = 'Automation and Release API and intergration support; supports REST APIs and external systems.'

//applies to all projects
subprojects {

    apply plugin: "java"
    apply plugin: "maven"
    apply plugin: "idea"
    apply plugin: 'com.adarshr.test-logger'
    apply plugin: "io.freefair.lombok"

    testlogger {
        theme 'mocha' // project level
        slowThreshold 5000
    }


    configurations.all {
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    }

    dependencies {

        implementation 'org.slf4j:slf4j-api:1.7.28'
        implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.2.3'
        implementation group: 'org.aeonbits.owner', name: 'owner', version: '1.0.10'
        implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.8.5'
        implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.8.5'
        implementation group: 'commons-lang', name: 'commons-lang', version: '2.6'
        implementation group: 'joda-time', name: 'joda-time', version: '2.9.9'
        implementation group: 'com.squareup.okhttp3', name: 'okhttp', version: '4.2.0'
        implementation group: 'com.jayway.jsonpath', name: 'json-path', version: '2.4.0'
        implementation group: 'org.apache.commons', name: 'commons-exec', version: '1.3'

        //implementation group: 'org.raml', name: 'raml-parser', version: '0.8.21'
        //implementation group: 'net.sourceforge.htmlunit', name: 'htmlunit', version: '2.30'
        //implementation group: 'org.jsoup', name: 'jsoup', version: '1.11.2'
        implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.0'
        implementation group: 'org.apache.commons', name: 'commons-text', version: '1.8'
        //implementation group: 'org.fluttercode.datafactory', name: 'datafactory', version: '0.8'
        implementation group: 'com.mashape.unirest', name: 'unirest-java', version: '1.4.9'
        implementation group: 'commons-dbutils', name: 'commons-dbutils', version: '1.7'
        //implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '3.11.0'
        implementation group: 'io.jsonwebtoken', name: 'jjwt', version: '0.9.0'
        implementation group: 'org.apache.directory.studio', name: 'org.apache.commons.io', version: '2.4'
        implementation group: 'commons-validator', name: 'commons-validator', version: '1.6'
        //implementation group: 'io.searchbox', name: 'jest', version: '5.3.3'
        //needed for testng priority listener
        implementation group: 'javassist', name: 'javassist', version: '3.12.1.GA'
        implementation group: 'com.github.javafaker', name: 'javafaker', version: '1.0.1'
        //implementation 'com.j2html:j2html:1.4.0'
        implementation "org.jtwig:jtwig-core:5.87.0.RELEASE"
        implementation group: 'org.jtwig', name: 'jtwig-json-extension', version: '5.86.1.RELEASE'
        implementation group: 'org.testng', name: 'testng', version: '7.0.0'
        implementation group: 'io.swagger', name: 'swagger-core', version: '2.0.0-rc2'
        implementation group: 'io.swagger', name: 'swagger-parser', version: '2.0.0-rc1'
        //implementation group: 'com.infoedge', name: 'jrandomizer', version: '0.1-beta1'
        implementation group: 'io.zipkin.brave', name: 'brave', version: '5.9.1'
        implementation group: 'com.sumologic.api.client', name: 'sumo-java-client', version: '2.7'
        implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'
        compileOnly 'org.projectlombok:lombok:1.18.12'
        annotationProcessor 'org.projectlombok:lombok:1.18.12'
        
        //stash integration
        implementation group: 'com.atlassian.stash', name: 'stash-java-client-api', version: '2.3.10'
        implementation group: 'com.atlassian.stash', name: 'stash-java-client-core', version: '2.3.10'
        implementation group: 'com.atlassian.stash', name: 'stash-java-client-httpclient', version: '2.3.10'
        implementation group: 'com.google.code.gson', name: 'gson', version: '2.2.4'
        
        
        //jira
        implementation 'io.atlassian.fugue:fugue:4.7.2'
        implementation 'com.atlassian.jira:jira-rest-java-client-core:5.2.1'
        implementation 'com.atlassian.jira:jira-rest-java-client-api:5.2.1'
        testCompile group: 'org.assertj', name: 'assertj-core', version: '3.13.2'
    }
}

//Common Project specific stuff
project(':common-core') {

    println "Project name is $name"
    task profileTask  {
        println "Task name is $name"
    }

    install {
        repositories.mavenInstaller {
            pom.version = '1.0-SNAPSHOT'
            pom.artifactId = 'common-core'
        }
    }
}


project(':rest-core') {

    println "Project name is $name"
    task profileTask  {
        println "Task name is $name"
    }

    install {
        repositories.mavenInstaller {
            pom.version = '1.0-SNAPSHOT'
            pom.artifactId = 'rest-core'
        }
    }
}

configurations {
    childJars
}

dependencies {
    subprojects.each {
        childJars project(it.path)
    }
}

jar {
    dependsOn configurations.childJars
    from { configurations.childJars.collect { zipTree(it) } }
    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
}

task sourcesJar(type: Jar, dependsOn: classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
}
task javadocJar(type: Jar, dependsOn: javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
}

if (JavaVersion.current().isJava8Compatible()) {
    allprojects {
        tasks.withType(Javadoc) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }
}


test {
    // Use TestNG for unit tests
    useTestNG()
}

ext.admin = hasProperty('sonatypeUsername')

artifacts {
    archives jar
    archives sourcesJar
    archives javadocJar
}

signing {
    required {false}
    sign publishing.publications
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            customizePom(pom, rootProject)

            artifact sourcesJar
            artifact javadocJar
        }
    }
    repositories {
        maven {
            url "https://oss.sonatype.org/service/local/staging/deploy/maven2"
            if (admin) {
                credentials {
                    username sonatypeUsername
                    password sonatypePassword
                }
            }
        }
    }
}

model {
    tasks.publish {
        dependsOn(project.tasks.build)
    }
    tasks.install {
        dependsOn(project.tasks.build)
    }
}

def customizePom(pom, gradleProject) {
    pom.withXml {
        def root = asNode()
        // modify POM and add optional flag where needed
        root.dependencies.'*'.findAll {

            ext.artifactId = it.artifactId.text()
            ext.fulldep = it.groupId.text() + ':' + it.artifactId.text() + ':' + it.version.text()
        }
        
        // add all items necessary for maven central publication
        root.children().last() + {
            println("Name:" + gradleProject.name)
            description gradleProject.description// moduleDescription
            resolveStrategy = Closure.DELEGATE_FIRST

            name 'Repo Qreasp'
            description gradleProject.description
            url 'https://github.com/restbusters/qreasp'
            organization {
                name 'restbusters'
                url 'https://restbusters.com'
            }
            issueManagement {
                system 'GitHub'
                url 'https://github.com/restbusters/qreasp/issues'
            }
            licenses {
                license {
                    name 'The Apache Software License, Version 2.0'
                    url 'https://github.com/restbusters/qreasp/blob/master/LICENSE'
                    distribution 'repo'
                }
            }
            scm {
                url 'https://github.com/restbusters/qreasp'
                connection 'scm:git:git://github.com/restbusters/qreasp.git'
                developerConnection 'scm:git:ssh://git@github.com/restbusters/qreasp.git'
            }
            developers {
                developer {
                    id 'ed'
                    name 'Ed Vayn'
                    email 'restbusterstech@gmail.com'
                    timezone '+1'
                }
                developer {
                    id 'Alex'
                    name 'Alexander Matsaylo'
                    email 'restbusterstech@gmail.com'
                    timezone '+1'
                }
            }
        }
    }
}

task install(dependsOn: publishToMavenLocal) {
    group = 'Publishing'
    description = 'Installs artifacts to local Maven repository'
}

//
// RELEASE
//

task release() {
    group 'Project'
    description 'Builds everything for the release.'

    dependsOn build
    dependsOn javadoc
    //dependsOn jacocoTestReport
}
