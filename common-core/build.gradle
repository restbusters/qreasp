plugins {
    // Apply the java-library plugin to add support for Java Library
    id 'java-library'
    id 'java'
}

dependencies {
    compile group: 'com.github.seratch', name: 'jslack', version: '1.1.1'
    compile group: 'org.skyscreamer', name: 'jsonassert', version: '1.5.0'
}

test {
    // enable TestNG support (default is JUnit)
    print "Staring test task"
    useTestNG()

    include 'com/restbusters/core/util/common/**'
    exclude 'com/restbusters/core/util/cmd/**'
    exclude 'com/restbusters/core/integration/jira/**'

    // set heap size for the test JVM(s)
    minHeapSize = "128m"
    maxHeapSize = "512m"

    // show standard out and standard error of the test JVM(s) on the console
    testLogging.showStandardStreams = true

    // listen to events in the test execution lifecycle
    beforeTest { descriptor ->
        logger.lifecycle("Running test: " + descriptor)
    }

    onOutput { descriptor, event ->
        logger.lifecycle("Test: " + descriptor + " produced standard out/err: " + event.message )
    }

}